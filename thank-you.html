<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terima Kasih — AI Design Studio</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .thankyou-wrap {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .thankyou-card {
            max-width: 480px;
        }
        .thankyou-icon {
            font-size: 3.5rem;
            margin-bottom: 16px;
        }
        .thankyou-card h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .thankyou-card p {
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .thankyou-card .btn-primary {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="thankyou-wrap">
        <div class="thankyou-card">
            <div class="thankyou-icon">✅</div>
            <h1>Pesan Terkirim!</h1>
            <p>Terima kasih sudah mempercayakan desainmu ke AI Design Studio. Kami akan menghubungimu lewat WhatsApp atau email dalam 1×24 jam untuk konfirmasi brief dan pengiriman QR pembayaran.</p>
            <a href="/" class="btn-primary">Kembali ke Beranda</a>
        </div>
    </div>
</body>
</html>
