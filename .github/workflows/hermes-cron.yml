name: Hermes Order Processor
on:
  schedule:
    - cron: '*/10 * * * *'  # tiap 10 menit
  workflow_dispatch:  # bisa ditrigger manual dari tab Actions
jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        run: pip install http
      - name: Scan for new orders (PAID/CONCEPT, hermes=WAITING)
        run: |
          echo "[Hermes] scanning orders.json for new work..."
          curl -s https://raw.githubusercontent.com/Tyowe/ai-design-studio/main/orders.json -o /tmp/orders.json || echo "[]" > /tmp/orders.json
          python - << 'PY'
          import json
          try:
              orders = json.load(open('/tmp/orders.json'))
          except:
              orders = []
          pending = [o for o in orders if o.get("hermes") in ("WAITING","QUEUED") or o.get("status") in ("PAID","CONCEPT")]
          print(f"Pending orders: {len(pending)}")
          for o in pending:
              print("  ->", o.get("code"), o.get("client"))
          # simulate generating a concept file per order
          for o in pending:
              cid = o.get("id") or o.get("code","?").replace("/","-")
              with open(f"concepts/{cid}.md","w") as f:
                  f.write(f"# {o.get('code')} — {o.get('client')}\n\nGenerated by Hermes cron at runtime.\n")
          PY
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
      - name: Commit & push concept files
        run: |
          mkdir -p concepts
          git config user.name "hermes-bot"
          git config user.email "hermes@example.com"
          git add concepts/ 2>/dev/null || true
          git diff --quiet && git diff --cached --quiet || (git commit -m "auto: Hermes concepts generated" && git push)
